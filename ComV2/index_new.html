<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>ComfyUI 控制台</title>
    
    <!-- 外部库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <!-- Tailwind 配置 -->
    <script src="/static/js/config.js"></script>
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen grid-bg transition-colors duration-300">
HMTL_BODY_PLACEHOLDER
    <!-- Three.js 导入映射 -->
    <script type="importmap" src="/static/js/importmap.json"></script>
    
    <!-- 模块脚本 -->
    <script type="module" src="/static/js/orbit.js"></script>
    <!-- 页面编码标识器（右下角） -->
    <div id="pageEncoder" class="fixed bottom-2 right-2 z-[9999] bg-slate-800/80 backdrop-blur-sm border border-slate-600/50 rounded-lg px-3 py-1.5 text-xs text-slate-400 font-mono select-none">
        <span class="text-blue-400">PAGE:</span> <span id="pageCode">index_new.html</span> | 
        <span class="text-cyan-400">VER:</span> <span id="pageVer">2.0</span>
    </div>
    <script>
        (function() {
            const path = window.location.pathname;
            const pageName = path.split('/').pop() || 'index_new.html';
            document.getElementById('pageCode').textContent = pageName;
            fetch('/version.json')
                .then(r => r.ok ? r.json() : null)
                .then(v => { if(v && v.version) document.getElementById('pageVer').textContent = v.version; })
                .catch(() => {});
        })();
    </script>
</body>
</html>
